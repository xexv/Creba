name: Release Creba

# Ручной запуск из вкладки Actions: вводишь версию и патчноуты,
# workflow собирает Creba под Windows/macOS/Linux (x64 + ARM64)
# и публикует GitHub Release с этими патчноутами.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например 1.0.0)'
        required: true
        default: '1.0.0'
      notes:
        description: 'Патчноуты (markdown, попадут в описание релиза)'
        required: true
        default: '- Первый релиз Creba'
      draft:
        description: 'Создать как черновик (draft)?'
        type: boolean
        default: true
      prerelease:
        description: 'Пометить как pre-release?'
        type: boolean
        default: false

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows-latest      # x86_64
            args: ''
            rust-target: ''
          - platform: windows-11-arm      # aarch64
            args: ''
            rust-target: ''
          # macOS
          - platform: macos-latest        # Apple Silicon (arm64)
            args: '--target aarch64-apple-darwin'
            rust-target: 'aarch64-apple-darwin'
          - platform: macos-13            # Intel (x86_64)
            args: '--target x86_64-apple-darwin'
            rust-target: 'x86_64-apple-darwin'
          # Linux (только x86_64 — сборка AppImage под ARM нестабильна)
          - platform: ubuntu-22.04        # x86_64
            args: ''
            rust-target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Системные зависимости для Tauri на Linux (WebKitGTK и пр.)
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev cmake

      - name: Install frontend dependencies
        run: pnpm install

      # Shelter-инжектор скачивается отдельно (в репозиторий не входит)
      - name: Fetch shelter injector
        run: pnpm shupdate

      # WebKitGTK-расширение (libextension.so) собирается через cmake, только Linux
      - name: Build WebKitGTK extension (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          cd src-tauri/extension_webkit
          cmake .
          cmake --build .

      # Проставляем введённую версию в конфиги перед сборкой
      - name: Set version
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.version='${{ inputs.version }}';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const f='package.json';const j=require('./'+f);j.version='${{ inputs.version }}';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: Creba v${{ inputs.version }}
          releaseBody: ${{ inputs.notes }}
          releaseDraft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}
